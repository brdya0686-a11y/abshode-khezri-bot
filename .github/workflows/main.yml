name: Abshode Khezri Gold Rates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bot.py
      - .github/workflows/main.yml
  schedule:
    # GitHub cron uses UTC. Tehran = UTC+03:30 throughout the year.
    # Runs every five minutes from Iran 08:30; bot enforces 08:30–00:59.
    - cron: '*/5 5-21 * * *'

permissions:
  contents: write

concurrency:
  group: abshode-khezri-rates
  cancel-in-progress: false

jobs:
  publish-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify mesghal-only quotes, price offsets, and daily report
        run: |
          python -m py_compile bot.py
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from bot import (
              in_price_hours, session_day, parse_mesghal_quotes, parse_observations,
              record_observations, night_summary, format_rate_message,
              adjust_all_market_rates, SELL_MARKUP_TOMAN, BUY_DISCOUNT_TOMAN
          )
          zone = ZoneInfo("Asia/Tehran")
          at = lambda h,m: datetime(2026,10,25,h,m,tzinfo=zone)
          assert in_price_hours(at(8,30))
          assert not in_price_hours(at(8,29))
          assert in_price_hours(at(0,59))
          assert not in_price_hours(at(1,0))
          assert not in_price_hours(at(7,59))
          assert session_day(at(0,59)) == "2026-10-24"
          assert session_day(at(1,1)) == "2026-10-24"
          assert session_day(at(8,30)) == "2026-10-25"
          assert (SELL_MARKUP_TOMAN, BUY_DISCOUNT_TOMAN) == (35000, 50000)
          raw = ("💰 پس فردایی دوشنبه\n◀️ هر مثقال\n🟢 فروش : ۱۱۰,۸۰۰,۰۰۰\n"
                 "🔴 خرید : ۱۱۰,۳۴۰,۰۰۰\n◀️ هرگرم\n"
                 "🟢 فروش : ۲۵,۵۷۸,۲۸۲\n🔴 خرید : ۲۵,۴۷۲,۰۹۰\n@valaneia_gold")
          expected = adjust_all_market_rates(raw)
          assert "فروش : 110,835,000" in expected, expected
          assert "خرید : 110,290,000" in expected, expected
          assert "25,578,282" not in expected and "گرم" not in expected, expected
          rates = parse_observations(expected)
          assert rates == {
              "پس‌فردایی | مثقال | فروش": 110835000,
              "پس‌فردایی | مثقال | خرید": 110290000
          }, rates
          msg = format_rate_message(expected)
          assert "<b>110,835,000</b>" in msg and "<b>110,290,000</b>" in msg, msg
          assert "گرم" not in msg and "25,472,090" not in msg, msg
          assert "@valaneia_gold" not in msg and "@khezriabshodeh" in msg
          assert "گرم" not in format_rate_message(raw)
          assert format_rate_message("هرگرم\nفروش : ۲۵,۵۷۸,۲۸۲\nخرید : ۲۵,۴۷۲,۰۹۰") == ""
          assert adjust_all_market_rates("هرگرم\nفروش : ۲۵,۵۷۸,۲۸۲") == ""
          assert adjust_all_market_rates("بدون نرخ ۱۲۳۴۵۶") == ""
          assert "گرم" not in format_rate_message("هر مثقال\nفروش : ۱۱۰,۸۰۰,۰۰۰\nهر گرم\nخرید : ۲۵,۴۷۲,۰۹۰")
          assert "خرید" not in format_rate_message("هر مثقال\nفروش : ۱۱۰,۸۰۰,۰۰۰\nهر گرم\nخرید : ۲۵,۴۷۲,۰۹۰")
          for market in ("نقد امروز", "نقدی", "نقد فردا یکشنبه", "فردایی", "پس‌فردایی"):
              sample = (market + "\nهر مثقال\nفروش : ۱۱۰,۸۰۰,۰۰۰\nخرید : ۱۱۰,۳۴۰,۰۰۰\n"
                        "هرگرم\nفروش : ۲۵,۵۷۸,۲۸۲\nخرید : ۲۵,۴۷۲,۰۹۰")
              outgoing = adjust_all_market_rates(sample)
              assert "110,835,000" in outgoing and "110,290,000" in outgoing, outgoing
              assert "گرم" not in outgoing and "25,578,282" not in outgoing
          mixed = ("نقد امروز\nهر مثقال\nفروش: ۱۰۸,۳۶۰,۰۰۰\nخرید: ۱۰۷,۷۳۰,۰۰۰\n"
                   "هر گرم\nفروش: ۲۴,۰۰۰,۰۰۰\nفردایی\nهر مثقال\n"
                   "فروش: ۱۱۰,۸۰۰,۰۰۰\nخرید: ۱۱۰,۳۴۰,۰۰۰")
          assert len(parse_mesghal_quotes(mixed)) == 2
          assert len(parse_mesghal_quotes("هر گرم\nفروش: ۲۴,۰۰۰,۰۰۰")) == 0
          out = adjust_all_market_rates(mixed)
          assert "108,395,000" in out and "110,835,000" in out
          assert "24,000,000" not in out
          state = {"daily": {"2026-10-24": {"نقدی | گرم | خرید": {"high": 25000000, "low": 25000000, "first": 25000000, "last": 25000000, "count": 1}}}}
          record_observations(state, at(0,55), expected)
          summary = night_summary(state, "2026-10-24")
          assert "110,835,000" in summary and "110,290,000" in summary
          assert "گرم" not in summary and "25,000,000" not in summary
          print("All mesghal-only rate tests passed")
          PY

      - name: Send a single clearly labeled sample
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'test: publish marked Telegram preview' }}"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: '@khezriabshodeh'
        run: |
          python - <<'PY'
          from bot import format_rate_message, in_price_hours, iran_time, send_rate
          if not in_price_hours(iran_time()):
              print("Preview not sent: outside Iran 08:30–01:00 window")
          else:
              previous_sample = (
                  "💰\nپس فردایی دوشنبه\n◀️\nهر مثقال\n🟢\n"
                  "فروش : ۱۱۱,۳۶۰,۰۰۰\n🔴\nخرید : ۱۱۰,۹۲۰,۰۰۰\n"
                  "@valaneia_gold"
              )
              message = "🧪 <b>نمونه آزمایشی؛ نرخ فعلی بازار نیست</b>\n" + format_rate_message(previous_sample)
              send_rate(message)
              print("One clearly labeled preview sent successfully")
          PY

      - name: Check for updated rates every ten seconds
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: '@khezriabshodeh'
          RUN_SECONDS: '270'
        run: python -u bot.py

      - name: Save last published rate to avoid duplicates
        if: always()
        run: |
          if [ -f .bot_state.json ]; then
            cp .bot_state.json /tmp/abshode-bot-state.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Start from latest main, not an outdated checkout, to avoid
            # overwriting concurrent bot or workflow edits.
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/abshode-bot-state.json .bot_state.json
              git add .bot_state.json
              if git diff --cached --quiet; then
                echo "No new bot state to save"
                break
              fi
              git commit -m "chore: remember last posted gold rate [skip ci]"
              if git push origin HEAD:main; then
                echo "Bot state saved"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to save bot state after retries" >&2
                exit 1
              fi
              sleep 2
            done
          fi
