name: Abshode Khezri Gold Rates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - bot.py
      - .github/workflows/main.yml
  schedule:
    # GitHub cron uses UTC. Tehran = UTC+03:30 throughout the year.
    # Covers Iran 08:00 through 01:29 the next day, including end-of-day summary.
    - cron: '30-59/5 4 * * *'
    - cron: '*/5 5-21 * * *'

permissions:
  contents: write

concurrency:
  group: abshode-khezri-rates
  cancel-in-progress: false

jobs:
  publish-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify hours, price parsing, summary, and compact format
        run: |
          python -m py_compile bot.py
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from bot import in_price_hours, session_day, parse_observations, record_observations, night_summary, format_rate_message, adjust_pasfardai_rates
          zone = ZoneInfo("Asia/Tehran")
          at = lambda h,m: datetime(2026,10,25,h,m,tzinfo=zone)
          assert in_price_hours(at(8,0))
          assert in_price_hours(at(0,59))
          assert not in_price_hours(at(1,0))
          assert not in_price_hours(at(7,59))
          assert session_day(at(0,59)) == "2026-10-24"
          assert session_day(at(1,1)) == "2026-10-24"
          assert session_day(at(8,0)) == "2026-10-25"
          raw = "پس فردایی دوشنبه\nهر مثقال\n🟢\nفروش : ۱۱۱,۳۶۰,۰۰۰\n🔴\nخرید : ۱۱۰,۹۲۰,۰۰۰\nهرگرم\nفروش : ۲۵,۷۰۷,۵۵۸\nخرید : ۲۵,۶۰۵,۹۸۴\n@valaneia_gold"
          rates = parse_observations(raw)
          assert rates["پس‌فردایی | مثقال | فروش"] == 111360000, rates
          assert rates["پس‌فردایی | گرم | خرید"] == 25605984, rates
          state = {"daily": {}}
          record_observations(state, at(0,55), raw)
          summary = night_summary(state, "2026-10-24")
          assert "111,360,000" in summary and "110,920,000" in summary
          assert "نوع معامله نامشخص" not in summary
          msg = format_rate_message(raw)
          assert "@valaneia_gold" not in msg and "@khezriabshodeh" in msg
          assert "<b>111,360,000</b>" in msg
          adjusted = adjust_pasfardai_rates(raw)
          changed = parse_observations(adjusted)
          assert changed["پس‌فردایی | مثقال | فروش"] == 111610000, changed
          assert changed["پس‌فردایی | مثقال | خرید"] == 110870000, changed
          assert changed["پس‌فردایی | گرم | فروش"] == 25765271, changed
          assert changed["پس‌فردایی | گرم | خرید"] == 25594441, changed
          assert "<b>111,610,000</b>" in format_rate_message(adjusted)
          unchanged = "نقد فردا یکشنبه\\nهر مثقال\\nفروش : ۱۰۸,۳۶۰,۰۰۰\\nخرید : ۱۰۷,۷۳۰,۰۰۰"
          assert adjust_pasfardai_rates(unchanged) == unchanged
          combined = raw + "\\n" + unchanged
          assert "فروش : ۱۰۸,۳۶۰,۰۰۰" in adjust_pasfardai_rates(combined)
          print("All bot quality checks passed")
          PY

      - name: Send a single clearly labeled sample
        if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'test: publish marked Telegram preview' }}"
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: '@khezriabshodeh'
        run: |
          python - <<'PY'
          from bot import format_rate_message, in_price_hours, iran_time, send_rate
          if not in_price_hours(iran_time()):
              print("Preview not sent: outside Iran 08:00–01:00 window")
          else:
              previous_sample = (
                  "💰\nپس فردایی دوشنبه\n◀️\nهر مثقال\n🟢\n"
                  "فروش : ۱۱۱,۳۶۰,۰۰۰\n🔴\nخرید : ۱۱۰,۹۲۰,۰۰۰\n"
                  "◀️\nهر گرم\n🟢\nفروش : ۲۵,۷۰۷,۵۵۸\n"
                  "🔴\nخرید : ۲۵,۶۰۵,۹۸۴\n@valaneia_gold"
              )
              message = "🧪 <b>نمونه آزمایشی؛ نرخ فعلی بازار نیست</b>\n" + format_rate_message(previous_sample)
              send_rate(message)
              print("One clearly labeled preview sent successfully")
          PY

      - name: Check for updated rates every ten seconds
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: '@khezriabshodeh'
          RUN_SECONDS: '270'
        run: python -u bot.py

      - name: Save last published rate to avoid duplicates
        if: always()
        run: |
          if [ -f .bot_state.json ]; then
            cp .bot_state.json /tmp/abshode-bot-state.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Start from latest main, not an outdated checkout, to avoid
            # overwriting concurrent bot or workflow edits.
            for attempt in 1 2 3; do
              git fetch origin main
              git reset --hard origin/main
              cp /tmp/abshode-bot-state.json .bot_state.json
              git add .bot_state.json
              if git diff --cached --quiet; then
                echo "No new bot state to save"
                break
              fi
              git commit -m "chore: remember last posted gold rate [skip ci]"
              if git push origin HEAD:main; then
                echo "Bot state saved"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to save bot state after retries" >&2
                exit 1
              fi
              sleep 2
            done
          fi
